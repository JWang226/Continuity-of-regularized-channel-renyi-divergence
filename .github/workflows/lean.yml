name: Lean proof verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LEAN_NUM_THREADS: 4
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: "false"
          build: "true"
          build-args: "All ChannelContinuity QuantumChannelContinuity ComparatorChallenges"
          test: "false"
          lint: "false"
          use-mathlib-cache: "true"
      - name: Audit all proof axioms
        run: lake env lean Audit.lean
      - name: Check publication and review artifacts
        run: python3 scripts/check-artifacts.py
