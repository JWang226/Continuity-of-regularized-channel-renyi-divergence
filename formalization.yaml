sources:
  - title: "Continuity of Regularized Channel Rényi Divergences"
    authors: ["Jinzhao Wang", "Yuxiang Yang"]
    id: "arXiv:2609.28635v1"
    type: "preprint"
    url: "https://arxiv.org/abs/2609.28635v1"
    html: "https://arxiv.org/html/2609.28635v1"
    submitted: "2026-09-23"
    notes: >-
      Published paper used for the theorem and equation locators below.
      The retained development manuscript is recorded separately; it is not
      asserted to be byte-identical to the arXiv source archive.
  - title: "Development manuscript snapshot"
    authors: ["Jinzhao Wang", "Yuxiang Yang"]
    id: "docs/source-manuscript.tex"
    type: "manuscript-snapshot"
    sha256: "76a8d6a961f9e8b70c7ffd0bb40fc351fcb1fa431cdbbbc30e70e25d73725eba"
    notes: >-
      User-supplied source used during proof development. Its LaTeX labels
      provide stable local locators in docs/paper-mapping.json.

status:
  scope: >-
    Theorem 1: the two-sided order-one limit of regularized stabilized
    sandwiched Rényi channel divergence, including infinite divergence;
    also the two normalized block-limit identities. The later operational
    corollaries in the manuscript are outside scope.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  notes: >-
    Counts apply to the completed proof library. Comparator challenge holes
    and the intentional missing-proof negative control are separate and are
    not imported by the solution. The final theorem has no quantum divergence,
    Stinespring/filter, Schatten, or regularization hypotheses.
  main_results:
    - name: "Continuity at order one"
      declaration: "QuantumChannelContinuity.theorem_one"
      file: "QuantumChannelContinuity/Main.lean"
      source_id: "arXiv:2609.28635v1"
      source_result: "Theorem 1"
      source_equations: ["1.1"]
      manuscript_labels: ["thm:main", "eq:main"]
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "ComparatorChallenges/ChannelRenyiContinuity.json"
    - name: "Rényi regularization as a block limit"
      declaration: "QuantumChannelContinuity.blockRenyi_tendsto_regularized"
      file: "QuantumChannelContinuity/RegularizationLimits.lean"
      source_id: "arXiv:2609.28635v1"
      source_result: "Rényi instance of the regularization identity"
      source_equations: ["1.5"]
      manuscript_labels: ["eq:regularized"]
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "ComparatorChallenges/ChannelRenyiContinuity.json"
    - name: "Relative entropy regularization as a block limit"
      declaration: "QuantumChannelContinuity.blockRelative_tendsto_regularized"
      file: "QuantumChannelContinuity/RegularizationLimits.lean"
      source_id: "arXiv:2609.28635v1"
      source_result: "Relative-entropy instance of the regularization identity"
      source_equations: ["1.5"]
      manuscript_labels: ["eq:regularized"]
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "ComparatorChallenges/ChannelRenyiContinuity.json"

automation:
  methods:
    - method: "agent"
      models: ["GPT-6 Astra (OpenAI)"]
      framework: "Codex"
  notes: >-
    Developed with AI assistance at the author's request. The manuscript
    separately discloses AI assistance with the mathematical proof and drafting.
    No unrecorded runtime or cost estimate is asserted.

review:
  status: "agent-reviewed"
  notes: >-
    Lean axiom audit, Comparator statement/definition comparison, fresh Lean
    kernel replay, independent nanoda replay, and two rejecting negative
    controls passed for the recorded original source. Historical check used
    unsandboxed macOS development mode and a reference recorded after proof
    development. A separate agent read-back from Lean definitions and a
    subsequent manuscript comparison are recorded in docs/LEAN_READBACK.md
    and docs/PAPER_COMPARISON.md. They are AI-assisted review, not independent
    human certification. See Verification/README.md for scope and source identity.

artifacts:
